name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CLI 패키지 빌드·격리 설치
        run: |
          package_dir="$(mktemp -d)"
          venv_dir="$(mktemp -d)"
          workspace="$(mktemp -d)"
          trap 'rm -rf "$package_dir" "$venv_dir" "$workspace"' EXIT
          python3 -m pip install --upgrade build twine
          python3 -m build --outdir "$package_dir"
          python3 -m twine check "$package_dir"/*
          python3 -m venv "$venv_dir"
          "$venv_dir/bin/pip" install "$package_dir"/*.whl
          "$venv_dir/bin/neo-korean-writing" assets
          "$venv_dir/bin/neo-korean-writing" init "$workspace" --profile press-release
          test -s "$workspace/prompts/press-release-editing.md"
          test -s "$workspace/templates/editing-brief.md"
          "$venv_dir/bin/neo-korean-writing" verify "$workspace/README.md" "$workspace/README.md" --strict
          mkdir -p "$RUNNER_TEMP/neo-korean-writing-package"
          cp "$package_dir"/* "$RUNNER_TEMP/neo-korean-writing-package/"
      - name: CLI 배포본 아티팩트 보관
        uses: actions/upload-artifact@v4
        with:
          name: neo-korean-writing-python-package
          path: ${{ runner.temp }}/neo-korean-writing-package
          if-no-files-found: error
          retention-days: 14
      - name: taxonomy 무결성
        run: python3 scripts/korean_writing.py taxonomy --check
      - name: v10 참조·버전·배포 자산 무결성
        run: python3 scripts/validate_repo.py
      - name: 저장소 자체 문체 회귀
        run: python3 scripts/self_scan.py --check
      - name: 장르별 오탐·적중 fixture
        run: python3 scripts/evaluate_fixtures.py
      - name: 회귀 테스트
        run: python3 -m unittest discover -s tests -v
      - name: v10 Skill 배포본 재현 빌드
        run: python3 scripts/build_skill_package.py --output "$RUNNER_TEMP/neo-korean-writing.skill"
      - name: v10 Skill 배포본 보관
        uses: actions/upload-artifact@v4
        with:
          name: neo-korean-writing-skill
          path: ${{ runner.temp }}/neo-korean-writing.skill
          if-no-files-found: error
          retention-days: 14
      - name: v10 Detect·보존·인계 smoke
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s\n' '첫 문장이다.' '' '이 방식은 혁신적이다.' > "$tmpdir/draft.md"
          python3 scripts/korean_writing.py diagnose "$tmpdir/draft.md" --profile column --json > "$tmpdir/detect.json"
          python3 - "$tmpdir/detect.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert any(f["span"] == "혁신적" and f["location"]["line"] == 3 for f in data["findings"])
          PY
          python3 scripts/korean_writing.py handoff-validate templates/writer-editor-handoff.json --json
          python3 scripts/korean_writing.py structure tests/fixtures/false_positive/column.txt --json
      - name: 번역 감사 smoke
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cat > "$tmpdir/source.md" <<'EOF'
          John sat down.

          - He watched the rain.
          EOF
          cat > "$tmpdir/target.md" <<'EOF'
          존은 앉았다.

          - 그는 비를 바라보았다.
          EOF
          set +e
          python3 scripts/korean_writing.py translation-audit \
            "$tmpdir/source.md" "$tmpdir/target.md" \
            --direction en-to-ko --literary --json > "$tmpdir/result.json"
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            cat "$tmpdir/result.json"
            exit "$audit_status"
          fi
          python3 - "$tmpdir/result.json" <<'PY'
          import json
          import sys

          data = json.loads(open(sys.argv[1], encoding="utf-8").read())
          assert data["surface_lock"]["pass"] is True
          assert data["structure"]["pass"] is True
          assert data["status"] == "warn"
          assert data["human_review_required"] is True
          assert any(item["id"] == "LIT-1" for item in data["risks"])
          print("translation-audit smoke 통과: warn + LIT-1 사람 검토")
          PY
