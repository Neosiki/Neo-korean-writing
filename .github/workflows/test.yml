name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: taxonomy 무결성
        run: python3 scripts/korean_writing.py taxonomy --check
      - name: 회귀 테스트
        run: python3 -m unittest discover -s tests -v
      - name: korean-writing v7 계약
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("korean-writing/SKILL.md").read_text(encoding="utf-8")
          required = {
              "v7 레인": "v7 이중 레인과 검토 상태",
              "번역 감사": "translation-audit",
              "FID 차원": "FID-1~7",
              "문학 차원": "LIT-1~3",
              "문학 플래그": "--literary",
              "보존 게이트": "korean_writing.py preserve",
              "보류 상태": "`hold`",
          }
          missing = [label for label, marker in required.items() if marker not in text]
          forbidden = [
              "ai_trace_metrics.py",
              "check_preservation.py",
              "format_check.py",
              "consistency_report.py",
          ]
          stale = [name for name in forbidden if name in text]
          if missing or stale:
              raise SystemExit(f"korean-writing 계약 실패: missing={missing}, stale={stale}")
          print("korean-writing v7 계약 통과")
          PY
      - name: v7 번역 감사 smoke
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cat > "$tmpdir/source.md" <<'EOF'
          John sat down.

          - He watched the rain.
          EOF
          cat > "$tmpdir/target.md" <<'EOF'
          존은 앉았다.

          - 그는 비를 바라보았다.
          EOF
          set +e
          python3 scripts/korean_writing.py translation-audit \
            "$tmpdir/source.md" "$tmpdir/target.md" \
            --direction en-to-ko --literary --json > "$tmpdir/result.json"
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            cat "$tmpdir/result.json"
            exit "$audit_status"
          fi
          python3 - "$tmpdir/result.json" <<'PY'
          import json
          import sys

          data = json.loads(open(sys.argv[1], encoding="utf-8").read())
          assert data["surface_lock"]["pass"] is True
          assert data["structure"]["pass"] is True
          assert data["status"] == "warn"
          assert data["human_review_required"] is True
          assert any(item["id"] == "LIT-1" for item in data["risks"])
          print("translation-audit v7 smoke 통과: warn + LIT-1 사람 검토")
          PY
