name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: taxonomy 무결성
        run: python3 scripts/krh.py taxonomy --check
      - name: 회귀 테스트
        run: python3 -m unittest discover -s tests -v
